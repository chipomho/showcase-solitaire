name: solitaire

services:
  certificates:
    image: docker.io/library/alpine:3.24
    command: ["/bin/sh", "/scripts/generate.sh"]
    volumes:
      - ./deploy/certs:/scripts:ro
      - ${SHOWCASES_CA_DIR:-./.certs}:/certs

  traefik:
    image: docker.io/library/traefik:v3.7
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    environment:
      SHOWCASES_HTTPS_PORT: ${SHOWCASES_HTTPS_PORT:-443}
    ports:
      - "${SHOWCASES_HTTP_PORT:-80}:80"
      - "${SHOWCASES_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/traefik:/etc/traefik:ro
      - ${SHOWCASES_CA_DIR:-./.certs}:/certs:ro
    depends_on:
      certificates:
        condition: service_completed_successfully
      web:
        condition: service_healthy

  web:
    build: .
    image: solitaire:local
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
